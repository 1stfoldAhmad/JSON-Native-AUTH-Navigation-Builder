name: Generated Project Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generated-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
